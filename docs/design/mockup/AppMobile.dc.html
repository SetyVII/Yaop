<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Yaop — Android, diario</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#f2f2f2}a:hover{color:#fff}
.m,.m *{box-sizing:border-box}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;border:0;background:transparent;color:#8b8b8b;font:400 16px 'Geist',sans-serif;cursor:pointer;position:relative;isolation:isolate;transition:color .3s}
.day .ac{position:absolute;inset:0;z-index:-1;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .45s cubic-bezier(.2,.8,.1,1)}
.day.on{color:#000}
.day.on .ac{transform:scaleY(1)}
.day:focus-visible{outline:1px solid #f2f2f2;outline-offset:-1px}
.todo{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:0;border:0;background:transparent;color:#f2f2f2;font:400 16px/1.4 'Geist',sans-serif;text-align:left;cursor:pointer}
.todo .bx{position:relative;flex:0 0 20px;height:20px;border:1px solid #5a5a5a}
.todo .bx::after{content:'';position:absolute;inset:4px;background:var(--accent);transform:scale(0);transition:transform .3s cubic-bezier(.2,.8,.1,1)}
.todo.done .bx{border-color:var(--accent)}
.todo.done .bx::after{transform:scale(1)}
.todo.done .tx{color: #7a7a7a;text-decoration:line-through;text-decoration-color:#444}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:64px;color:#7a7a7a;text-decoration:none}
.tab.on{color:#f2f2f2}
.cap{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border:0;background:var(--accent);color:#000;cursor:pointer;overflow:hidden;isolation:isolate}
.cap .wipe{position:absolute;inset:0;z-index:-1;background:#fff;transform:scaleY(0);transform-origin:bottom;transition:transform .4s cubic-bezier(.2,.8,.1,1)}
.cap:active .wipe,.cap:hover .wipe{transform:scaleY(1)}
@media (prefers-reduced-motion:reduce){.day .ac,.todo .bx::after,.cap .wipe{transition:none}}
</style>
</helmet>
<div class="m" style="--accent: {{accent}}; width: 390px; height: 844px; display: flex; flex-direction: column; background: #000000; color: #f2f2f2; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px; margin-top: 24px">
<svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"></rect><rect x="6" y="6" width="10" height="10" style="fill: var(--accent)"></rect></svg>
<button type="button" aria-label="Buscar" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-right: -12px; border: 0; background: transparent; color: #f2f2f2; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l4 4"></path></svg>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid #1f1f1f; border-bottom: 1px solid #1f1f1f">
<sc-for list="{{days}}" as="dy" hint-placeholder-count="7">
<button type="button" class="day {{dy.cls}}" aria-pressed="{{dy.pressed}}" aria-label="{{dy.aria}}" onClick="{{dy.pick}}"><span class="ac"></span><span class="mono" style="font-size: 10px; opacity: .7">{{dy.w}}</span><span>{{dy.n}}</span></button>
</sc-for>
</div>

<div style="flex: 1; overflow: hidden; padding: 32px 20px 0">
<p class="mono" style="margin: 0 0 10px; color: var(--accent)">{{kicker}}</p>
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 400; letter-spacing: -0.03em">{{title}}</h1>
<p style="margin: 24px 0 8px; font-size: 16px; line-height: 1.6; color: #d6d6d6">Café con Ana. Le enseñé el diario y preguntó cómo se cifra la sincronización.</p>
<div style="margin-top: 20px; border-top: 1px solid #1f1f1f; padding-top: 8px">
<sc-for list="{{tasks}}" as="tk" hint-placeholder-count="3">
<button type="button" class="todo {{tk.cls}}" aria-pressed="{{tk.pressed}}" onClick="{{tk.toggle}}"><span class="bx"></span><span class="tx">{{tk.text}}</span></button>
</sc-for>
</div>
<a href="https://www.inkandswitch.com/local-first/" style="display: flex; align-items: center; gap: 14px; margin-top: 20px; padding: 14px; border: 1px solid #262626; text-decoration: none; color: #f2f2f2">
<span style="width: 44px; height: 44px; border: 1px solid #333; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; background: var(--accent)"></span></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px">Local-first software</span><span class="mono" style="color: #7a7a7a">Enlace web</span></span>
</a>
</div>

<nav aria-label="Navegación" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; border-top: 1px solid #1f1f1f; padding: 0 8px 20px">
<a class="tab on mono" href="#"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="14" height="13"></rect><path d="M3 8h14"></path></svg>Hoy</a>
<a class="tab mono" href="#"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="3" width="6" height="6"></rect><rect x="11" y="3" width="6" height="6"></rect><rect x="3" y="11" width="6" height="6"></rect><rect x="11" y="11" width="6" height="6"></rect></svg>Objetos</a>
<div style="display: flex; justify-content: center"><button type="button" class="cap" aria-label="Capturar"><span class="wipe"></span><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 4v14M4 11h14"></path></svg></button></div>
<a class="tab mono" href="#"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h7"></path></svg>Consultas</a>
<a class="tab mono" href="#"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="10" cy="10" r="2.5"></circle><path d="M10 2v3M10 15v3M2 10h3M15 10h3"></path></svg>Ajustes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F04A","options":["#C8F04A","#7FD4FF","#FF8A3D","#F2F2F2"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel ?? 5;
    const done = st.done || { 1: true };
    const w = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
    const full = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const n = [16, 17, 18, 19, 20, 21, 22];
    const tasks = ['Mandarle a Ana el enlace de la beta', 'Comprar café', 'Revisar notas de la semana 47'];
    return {
      accent: this.props.accent ?? '#C8F04A',
      kicker: sel === 5 ? 'Hoy' : (sel < 5 ? 'Pasado' : 'Mañana'),
      title: full[sel] + ', ' + n[sel] + ' nov',
      days: w.map((x, i) => ({ w: x, n: n[i], aria: full[i] + ' ' + n[i], cls: i === sel ? 'on' : '', pressed: i === sel ? 'true' : 'false', pick: () => this.setState({ sel: i }) })),
      tasks: tasks.map((t, i) => ({ text: t, cls: done[i] ? 'done' : '', pressed: done[i] ? 'true' : 'false', toggle: () => this.setState({ done: Object.assign({}, done, { [i]: !done[i] }) }) }))
    };
  }
}
</script>
</body>
</html>
