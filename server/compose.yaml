name: yaop

services:
  server:
    image: yaop-server:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      YAOP_LISTEN: "0.0.0.0:8765"
      YAOP_DATA_DIR: "/data/yaop"
      YAOP_ALLOWED_ORIGINS: "${YAOP_ALLOWED_ORIGINS:-}"
    volumes:
      - yaop_data:/data/yaop
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s

volumes:
  yaop_data:
