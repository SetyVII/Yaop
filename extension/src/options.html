<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAOP Clipper Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="shell">
    <header class="hdr">
      <img src="../icons/icon48.png" alt="YAOP" width="36" height="36">
      <div>
        <h1 data-i18n="optTitle">YAOP Clipper Settings</h1>
        <p class="subtitle" data-i18n="optSubtitle">
          Connects strictly to your local YAOP Desktop over 127.0.0.1. Nothing leaves your machine unencrypted.
        </p>
      </div>
    </header>

    <form id="settings-form" class="card">
      <section class="group">
        <h2 data-i18n="optConnection">Local Desktop Connection</h2>

        <div class="row-2">
          <div class="field">
            <label for="opt-port" data-i18n="optPort">Local port</label>
            <input id="opt-port" type="number" min="1024" max="65535" value="47192">
          </div>
          <div class="field">
            <label>Endpoint</label>
            <input id="opt-endpoint" type="text" readonly value="http://127.0.0.1:47192">
          </div>
        </div>

        <div class="field">
          <label for="opt-token" data-i18n="optToken">Bearer token</label>
          <input id="opt-token" type="password" autocomplete="off" spellcheck="false">
          <small class="hint" data-i18n="optTokenHint">
            Open YAOP Desktop → Settings → Browser Extension → Copy Token.
          </small>
        </div>

        <div class="btn-row">
          <button id="btn-test" class="btn-secondary" type="button" data-i18n="btnTestConnection">
            Test connection
          </button>
          <span id="test-result" class="status-msg"></span>
        </div>
      </section>

      <section class="group">
        <h2 data-i18n="optWebP">WebP Image Conversion</h2>

        <div class="row-3">
          <div class="field">
            <label for="opt-cover-q" data-i18n="optCoverQuality">Cover quality (Web links, WebP)</label>
            <input id="opt-cover-q" type="number" min="40" max="95" value="90">
          </div>
          <div class="field">
            <label for="opt-img-q" data-i18n="optImageQuality">Image quality (saved images)</label>
            <input id="opt-img-q" type="number" min="40" max="98" value="82">
          </div>
          <div class="field">
            <label for="opt-img-max" data-i18n="optImageMaxWidth">Max image side (px)</label>
            <input id="opt-img-max" type="number" min="480" max="4096" step="64" value="1920">
          </div>
        </div>
      </section>

      <section class="group">
        <h2 data-i18n="optBehavior">Behavior</h2>
        <label class="check-row">
          <input id="opt-autoclose" type="checkbox" checked>
          <span data-i18n="optAutoClose">Close popup automatically after saving</span>
        </label>
        <label class="check-row">
          <input id="opt-notifs" type="checkbox" checked>
          <span data-i18n="optShowNotifications">Show browser notification for context-menu captures</span>
        </label>
      </section>

      <div class="footer">
        <button class="btn-primary" type="submit" data-i18n="btnSaveSettings">Save</button>
        <span id="save-msg" class="status-msg"></span>
      </div>
    </form>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
